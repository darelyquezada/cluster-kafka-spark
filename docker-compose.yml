# ===========================================================================
#  NODO MASTER sobre TAILSCALE  ->  Tu PC
#  Incluye: Spark Master + Kafka (KRaft, sin Zookeeper)
#  Requiere un archivo .env junto a este con:  TS_AUTHKEY=tskey-tu-llave
#  Arranca: docker compose up -d
# ===========================================================================
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-spark-master
    hostname: spark-master              # nombre en la tailnet (MagicDNS)
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
    volumes:
      - ./ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8080:8080"   # Web UI Master -> http://localhost:8080
      - "4040:4040"   # Web UI de la app cuando corras un job
    restart: unless-stopped

  spark-master:
    image: bitnamilegacy/spark:3.5.6
    container_name: spark-master
    network_mode: service:tailscale     # comparte la red del sidecar
    depends_on:
      - tailscale
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Esperando IP de Tailscale (100.x)..."
        while ! hostname -I | tr ' ' '\n' | grep -q '^100\.'; do sleep 2; done
        export SPARK_LOCAL_IP=$$(hostname -I | tr ' ' '\n' | grep '^100\.' | head -1)
        export SPARK_MASTER_HOST=$$SPARK_LOCAL_IP
        echo "==> SPARK_LOCAL_IP=$$SPARK_LOCAL_IP (master bind en esa IP)"
        exec /opt/bitnami/scripts/spark/entrypoint.sh /opt/bitnami/scripts/spark/run.sh
    volumes:
      - ./data:/data
      - ./jobs:/jobs
    restart: unless-stopped

  # ---- Kafka en modo KRaft (sin Zookeeper) ----
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - KAFKA_NODE_ID=${KAFKA_NODE_ID}
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@${SPARK_MASTER_IP}:9093,2@${WORKER1_IP}:9093,3@${WORKER2_IP}:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${LOCAL_TS_IP}:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=3
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped